openapi: 3.1.0
info:
  title: Mimico API
  version: 1.0.0
  description: REST contract for Mimico V1.
servers:
  - url: /api
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      summary: Register a user
      operationId: registerUser
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /auth/login:
    post:
      summary: Log in a user
      operationId: loginUser
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/logout:
    post:
      summary: Log out the current user
      operationId: logoutUser
      tags: [Auth]
      responses:
        "204":
          description: Logout successful.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/me:
    get:
      summary: Get the current user
      operationId: getCurrentUser
      tags: [Auth]
      responses:
        "200":
          description: Current user profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /lobby/online-users:
    get:
      summary: List online lobby users
      operationId: getOnlineUsers
      tags: [Lobby]
      responses:
        "200":
          description: Online users.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnlineUsersResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /tables:
    post:
      summary: Create a private table
      operationId: createTable
      tags: [Tables]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTableRequest"
      responses:
        "201":
          description: Table created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /tables/{tableId}:
    get:
      summary: Get table details
      operationId: getTable
      tags: [Tables]
      parameters:
        - $ref: "#/components/parameters/TableId"
      responses:
        "200":
          description: Table details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /matches/start:
    post:
      summary: Start a match
      operationId: startMatch
      tags: [Matches]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartMatchRequest"
      responses:
        "201":
          description: Match created in setup state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /matches/table/{tableId}:
    get:
      summary: Get the active match for a table
      operationId: getActiveMatchByTable
      tags: [Matches]
      parameters:
        - $ref: "#/components/parameters/TableId"
      responses:
        "200":
          description: Active match state for table.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchState"
        "204":
          description: No active match for table.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /matches/{matchId}/forfeit:
    post:
      summary: Forfeit a match
      operationId: forfeitMatch
      tags: [Matches]
      parameters:
        - $ref: "#/components/parameters/MatchId"
      responses:
        "200":
          description: Match forfeited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchEnded"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TableId:
      name: tableId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MatchId:
      name: matchId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Bad request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Unauthorized.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflict.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      $ref: "../schemas/error.schema.json"
    TeamAssignment:
      $ref: "../schemas/team-assignment.schema.json"
    MatchState:
      $ref: "../schemas/match-state.schema.json"
    RegisterRequest:
      type: object
      required: [email, password, nickname]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 100
        nickname:
          type: string
          minLength: 5
          maxLength: 20
          pattern: "^[a-zA-Z0-9_-]+$"
    RegisterResponse:
      type: object
      required: [userId, email, nickname]
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        nickname:
          type: string
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    LoginResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/UserProfile"
    UserProfile:
      type: object
      required: [userId, email, nickname, roles]
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        nickname:
          type: string
        avatarUrl:
          type: [string, "null"]
        roles:
          type: array
          items:
            type: string
    OnlineUsersResponse:
      type: object
      required: [users, count]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/UserProfile"
        count:
          type: integer
          minimum: 0
    CreateTableRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
    TableResponse:
      type: object
      required: [tableId, name, hostUserId, status, players, teamAssignments]
      properties:
        tableId:
          type: string
          format: uuid
        name:
          type: string
        hostUserId:
          type: string
          format: uuid
        status:
          type: string
          enum: [TABLE_WAITING, TABLE_READY_TO_START, TABLE_IN_MATCH, TABLE_BETWEEN_MATCHES, TABLE_CLOSED]
        players:
          type: array
          items:
            $ref: "#/components/schemas/UserProfile"
        teamAssignments:
          type: array
          items:
            $ref: "#/components/schemas/TeamAssignment"
    StartMatchRequest:
      type: object
      required: [tableId, teamAssignments]
      additionalProperties: false
      properties:
        tableId:
          type: string
          format: uuid
        teamAssignments:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: "#/components/schemas/TeamAssignment"
    MatchResponse:
      type: object
      required: [matchId, tableId, status, teamAPosition, teamBPosition, startedAt]
      properties:
        matchId:
          type: string
          format: uuid
        tableId:
          type: string
          format: uuid
        status:
          type: string
          enum: [MATCH_SETUP, MATCH_ACTIVE, MATCH_PAUSED, MATCH_FINISHED]
        currentTeam:
          type: [string, "null"]
          enum: [A, B, null]
        currentMimePlayerId:
          type: [string, "null"]
          format: uuid
        teamAPosition:
          type: integer
          minimum: 0
          maximum: 52
        teamBPosition:
          type: integer
          minimum: 0
          maximum: 52
        startedAt:
          type: string
          format: date-time
    MatchEnded:
      type: object
      required: [matchId, tableId, winnerTeam, reason]
      properties:
        matchId:
          type: string
          format: uuid
        tableId:
          type: string
          format: uuid
        winnerTeam:
          type: string
          enum: [A, B]
        reason:
          type: string
          enum: [BOARD_WIN, RECONNECTION_FORFEIT, MANUAL_FORFEIT, ADMIN_CANCELLED]
